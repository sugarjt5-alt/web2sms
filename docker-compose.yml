# Нууц утгууд (JWT_SECRET гэх мэт) энэ хавтасны .env файлаас уншигдана — .env.example-ийг үз.
services:
  postgres:
    image: postgres:16-alpine
    container_name: web2sms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: web2sms
      POSTGRES_PASSWORD: web2sms
      POSTGRES_DB: web2sms
    ports:
      - "127.0.0.1:5433:5432" # pgAdmin: localhost:5433, user/pass/db = web2sms (зөвхөн энэ компьютерээс)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2sms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: web2sms-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  backend:
    build: ./backend
    container_name: web2sms-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://web2sms:web2sms@postgres:5432/web2sms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET-ийг .env файлд тохируулна уу}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SIGNUP_FREE_CREDITS: ${SIGNUP_FREE_CREDITS:-0}
      SMS_PROVIDER: mock
      MOBICOM_API_URL: ""
      MOBICOM_API_KEY: ""
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["node", "src/server.js"]

  sms-worker:
    build: ./backend
    container_name: web2sms-sms-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://web2sms:web2sms@postgres:5432/web2sms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMS_PROVIDER: mock
      MOBICOM_API_URL: ""
      MOBICOM_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["node", "src/queue/smsWorker.js"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: web2sms-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
